name: Build ReadFlow Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readflow-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Android release signing secrets are not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/readflow-release.p12"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/readflow-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          bash ./gradlew --no-daemon assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk ReadFlow.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ReadFlow.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ReadFlow.apk | grep -F "package: name='com.richogata.readflow'"

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: readflow-android-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ReadFlow Android v${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: ReadFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add download link to summary
        run: |
          echo "Download ReadFlow for Android: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/ReadFlow.apk" >> "$GITHUB_STEP_SUMMARY"
